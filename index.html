<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCM & Epic">
<meta name="theme-color" content="#f2efe4">
<title>CCM & Epic Golf</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- Tema ANTES del CSS y del primer paint: si esto corriera en app.js
     se vería un flash del tema equivocado al abrir la app. -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('ccm-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = 'light';
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'light' ? '#f2efe4' : '#0c1a0f');
})();
</script>
<link rel="stylesheet" href="css/style.css?v=23">
<link rel="stylesheet" href="css/desafios.css?v=2">
<link rel="stylesheet" href="css/sorteo.css?v=1">
</head>
<body>

<!-- SPLASH -->
<div id="splash">
<div class="splash-inner">
<img src="icon-512.png" class="splash-logo" alt="CCM Epic Golf">
<div class="splash-flag">⛳</div>
<h1 class="splash-title">CCM <span>&</span> Epic</h1>
<p class="splash-sub">Golf Tournament</p>
<div class="splash-loader"><div></div></div>
</div>
</div>

<!-- APP SHELL -->
<div id="app" class="hidden">

<!-- HEADER -->
<header class="app-header">
<div class="header-left">
<span class="header-logo">⛳</span>
<span class="header-title">CCM <em>&</em> Epic</span>
</div>
<div class="header-right">
<span id="live-badge" class="live-badge hidden">EN VIVO</span>
<button class="icon-btn theme-btn" id="btn-theme" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
<button class="icon-btn" id="btn-refresh" title="Actualizar">↻</button>
</div>
</header>

<!-- NAV -->
<nav class="bottom-nav">
<button class="nav-item active" data-view="leaderboard">
<span class="nav-icon">🏆</span>
<span>Ranking</span>
</button>
<button class="nav-item" data-view="cuartos">
<span class="nav-icon">👥</span>
<span>Cuartos</span>
</button>
<button class="nav-item nav-cta" data-view="cargar">
<span class="nav-icon">✚</span>
<span>Cargar</span>
</button>
<button class="nav-item" data-view="matchs">
<span class="nav-icon">⚔️</span>
<span>Matchs</span>
</button>
<!-- Historial queda en el código pero fuera del nav (no se activó nunca).
     Su <section id="view-historial"> sigue abajo, intacta. -->
<button class="nav-item" data-view="desafios">
<span class="nav-icon">🔥</span>
<span>Desafíos</span>
</button>
<button class="nav-item" data-view="sorteo">
<span class="nav-icon">🎲</span>
<span>Sorteo</span>
</button>
</nav>

<!-- VIEWS -->
<main class="view-container">

<!-- LEADERBOARD -->
<section id="view-leaderboard" class="view active">
<div class="view-header">
<h2>Leaderboard</h2>
<span id="last-update" class="update-time"></span>
</div>

<div class="tabs">
<button class="tab active" data-tab="individual">Individual</button>
<button class="tab" data-tab="parejas">Parejas</button>
<button class="tab" data-tab="cuartos-rank">Cuartos</button>
</div>

<div id="tab-individual" class="tab-content active">
<div id="podio" class="podio"></div>
<div id="tabla-individual" class="score-table"></div>
</div>
<div id="tab-parejas" class="tab-content">
<div id="tabla-parejas" class="score-table"></div>
</div>
<div id="tab-cuartos-rank" class="tab-content">
<div id="tabla-cuartos" class="score-table"></div>
</div>
</section>

<!-- CUARTOS DETAIL -->
<section id="view-cuartos" class="view">
<div class="view-header">
<h2>Cuartos</h2>
</div>
<div id="cuartos-selector" class="cuartos-grid"></div>
<div id="cuarto-detail" class="cuarto-detail hidden"></div>
</section>

<!-- CARGAR SCORES -->
<section id="view-cargar" class="view">
<div class="view-header">
<h2>Cargar Scores</h2>
</div>
<form id="score-form" class="score-form" onsubmit="return false;">

<div class="form-step active" id="step-1">
<p class="step-label">Paso 1 — ¿Qué cuarto anotás?</p>
<div id="cuarto-btns" class="option-grid"></div>
</div>

<div class="form-step" id="step-2">
<p class="step-label">Paso 2 — ¿Qué hoyo terminaron?</p>
<div id="bloque-btns" class="option-grid hoyo-grid">
<button type="button" class="option-btn" data-bloque="1-1">1<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="2-2">2<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="3-3">3<br><span class="hoyo-par">P5</span></button>
<button type="button" class="option-btn" data-bloque="4-4">4<br><span class="hoyo-par">P3</span></button>
<button type="button" class="option-btn" data-bloque="5-5">5<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="6-6">6<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="7-7">7<br><span class="hoyo-par">P5</span></button>
<button type="button" class="option-btn" data-bloque="8-8">8<br><span class="hoyo-par">P3</span></button>
<button type="button" class="option-btn" data-bloque="9-9">9<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="10-10">10<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="11-11">11<br><span class="hoyo-par">P3</span></button>
<button type="button" class="option-btn" data-bloque="12-12">12<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="13-13">13<br><span class="hoyo-par">P5</span></button>
<button type="button" class="option-btn" data-bloque="14-14">14<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="15-15">15<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="16-16">16<br><span class="hoyo-par">P3</span></button>
<button type="button" class="option-btn" data-bloque="17-17">17<br><span class="hoyo-par">P4</span></button>
<button type="button" class="option-btn" data-bloque="18-18">18<br><span class="hoyo-par">P5</span></button>
</div>
</div>

<div class="form-step" id="step-3">
<p class="step-label">Paso 3 — Golpes por hoyo</p>
<div id="inputs-golpes" class="golpes-grid"></div>
</div>

<div class="form-step" id="step-4">
<p class="step-label">Confirmá antes de enviar</p>
<div id="confirm-preview" class="confirm-preview"></div>
<div class="form-actions">
<button type="button" id="btn-edit" class="btn-secondary">Editar</button>
<button type="button" id="btn-enviar" class="btn-primary">Enviar ✓</button>
</div>
</div>

<div id="form-success" class="form-success hidden">
<div class="success-icon">✓</div>
<p>¡Scores cargados!</p>
<button type="button" id="btn-nuevo" class="btn-secondary">Cargar otro hoyo</button>
</div>

</form>
</section>

<!-- MATCHS -->
<section id="view-matchs" class="view">
<div class="view-header">
<h2>Matchs</h2>
</div>
<div id="matchs-list" class="matchs-list"></div>
</section>

<!-- DESAFÍOS — todo el contenido lo pinta js/desafios.js -->
<section id="view-desafios" class="view">
<div class="view-header">
<h2>Desafíos</h2>
</div>
<div id="desafios-body"></div>
</section>

<!-- SORTEO — todo el contenido lo pinta js/sorteo.js -->
<section id="view-sorteo" class="view">
<div class="view-header">
<h2>Sorteo de cuartos</h2>
</div>
<div id="sorteo-body"></div>
</section>

<!-- HISTORIAL -->
<section id="view-historial" class="view">
<div class="view-header">
<h2>Historial</h2>
</div>
<div id="historial-list" class="historial-list"></div>
</section>

</main>
</div>

<!-- TARJETA INDIVIDUAL (modal) — se abre al clickear un nombre del ranking -->
<div id="tarjeta-modal" class="ti-modal" aria-hidden="true">
<div class="ti-modal-panel">
<button class="ti-modal-close" data-close-modal aria-label="Cerrar">✕</button>
<div id="tarjeta-modal-body" class="ti-modal-body"></div>
</div>
</div>

<script src="js/config.js?v=23"></script>
<script src="js/sheets.js?v=21"></script>
<script src="js/app.js?v=23"></script>
<!-- Módulo aparte. Si falla o no carga, el torneo sigue andando igual. -->
<script src="js/desafios.js?v=5"></script>
<script src="js/sorteo.js?v=2"></script>
<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
